<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Edit Trek</title>
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow">

                    <div class="card-header text-center">
                        <h3>Edit Trek</h3>
                    </div>

                    <div class="card-body">

                        {% with messages = get_flashed_messages() %}
                        {% if messages %}
                        {% for message in messages %}
                        <div class="alert alert-success">
                            {{ message }}
                        </div>
                        {% endfor %}
                        {% endif %}
                        {% endwith %}

                        <form method="POST">

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Trek Name</label>
                                    <input type="text"
                                           class="form-control"
                                           name="trek_name"
                                           value="{{ trek.trek_name }}"
                                           required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Location</label>
                                    <input type="text"
                                           class="form-control"
                                           name="location"
                                           value="{{ trek.location }}"
                                           required>
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">Difficulty</label>

                                    <select class="form-select" name="difficulty" required>

                                        <option value="Easy"
                                            {% if trek.difficulty=="Easy" %}selected{% endif %}>
                                            Easy
                                        </option>

                                        <option value="Moderate"
                                            {% if trek.difficulty=="Moderate" %}selected{% endif %}>
                                            Moderate
                                        </option>

                                        <option value="Hard"
                                            {% if trek.difficulty=="Hard" %}selected{% endif %}>
                                            Hard
                                        </option>

                                    </select>

                                </div>

                                

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">Status</label>

                                    <select class="form-select" name="status" required>

                                        <option value="Pending" {% if trek.status == "Pending" %}selected{% endif %}>
                                            Pending
                                        </option>

                                        <option value="Open" {% if trek.status == "Open" %}selected{% endif %}>
                                            Open
                                        </option>

                                        <option value="Closed" {% if trek.status == "Closed" %}selected{% endif %}>
                                            Closed
                                        </option>

                                        <option value="Completed" {% if trek.status == "Completed" %}selected{% endif %}>
                                            Completed
                                        </option>

                                    </select>

                                </div>



                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Total Slots</label>

                                    <input type="number"
                                           class="form-control"
                                           name="total_slots"
                                           value="{{ trek.total_slots }}"
                                           required>

                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">Start Date</label>

                                    <input type="date"
                                           class="form-control"
                                           name="start_date"
                                           value="{{ trek.start_date }}"
                                           required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">End Date</label>

                                    <input type="date"
                                           class="form-control"
                                           name="end_date"
                                           value="{{ trek.end_date }}"
                                           required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">Description</label>

                                <textarea class="form-control"
                                          name="description"
                                          rows="4"
                                          required>{{ trek.description }}</textarea>

                            </div>

                            <button type="submit" class="btn btn-primary">
                                Update Trek
                            </button>

                            <a href="{{ url_for('treks') }}"
                               class="btn btn-secondary">
                                Back
                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
